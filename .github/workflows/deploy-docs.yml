
name: 部署文档

on:
  push:
    branches:
      # 确保这是你正在使用的分支名称
      - main

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 如果你文档需要 Git 子模块，取消注释下一行
          # submodules: true

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建文档
        # npm run build 已包含：
        # 1. wiki-sync/sync.js      生成 Wiki 兜底清单
        # 2. wechat-sync/sync-from-mplist.js  抓取微信公众号文章
        # 3. wechat-sync/sync.js --replace    合并写入 src/wechat/config.js
        # 4. docusaurus build       构建静态站点到 build/
        run: npm run build

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: build
